# tymnet.cfg -- stand-alone TYMSAT configuration.
#
# This file plays the role the Tymfile plays in a real installation:
# "The Tymfile contains the macros that specify TYMSAT configuration
# and constraints. These features and options are set at system
# generation. Interactive access to the TYMSAT for changing options is
# not possible while the program is running."
#   -- Network Products Concepts and Facilities, Jan 1985, p. 5-10
#
# Accordingly nothing here can be changed by a logged-in user; there is
# no TYMSAT command surface. Blank lines and lines beginning with '#'
# are ignored. Used with:  padawan-lite --emulate tymnet -c tymnet.cfg
#
# The Telenet/X.25 address map lives in telenet.cfg and uses a
# different, simpler format -- the two are not interchangeable.


# --- node identity ---------------------------------------------------
#
# Reported to the user on the line before the login prompt, rendered
# "-NNNN-PPP-" ("How to Use TYMNET", July 1982, lines 34-37). The user
# is asked to quote these numbers when reporting line trouble, so they
# should look plausible for the installation being emulated.
#
#   node <number>     the remote access node the terminal reached
#   port <number>     the port on that node assigned to this session
#
# VERIFY: the 1982 pamphlet's "NNNN"/"PPP" are placeholders; it never
# states that the fields are fixed-width or zero-padded. We emit them
# unpadded.

node 4242
port 56

# Certain connections -- the pamphlet cites WATS lines -- show three
# numbers instead of two: node, slot, port (1982 pamphlet, line 84).
# Uncomment to emit the three-number form as -NNNN-SS-PPP-.
#
# VERIFY: the pamphlet describes this form but never shows it rendered;
# the separator layout below is assumed by analogy with the two-number
# case.
#
# slot 3


# --- message presentation --------------------------------------------
#
#   case lower | upper
#
# Which case the service messages take on the wire. The sources
# conflict: the 1982 pamphlet's procedural walkthrough (lines 28-59)
# shows lowercase in what reads as verbatim terminal transcript, while
# its MESSAGES catalogue (lines 196-289) and the 1985 manual (p. 5-8)
# both render the same strings uppercase -- but both of those are
# referential, naming a message in prose rather than showing a session.
# Default is lower; see include/tymsat.h for the full reasoning.
#
# VERIFY: unresolved without a byte-level capture.

case lower

#   accept call-connected | terse | verbose
#
# The connect acknowledgement, emitted once the circuit to the host is
# up. Three forms are known:
#
#   call-connected -> "call connected"   (default)
#   terse          -> ";"
#   verbose        -> "host is online"
#
# "call connected" is the observed behaviour of a 1986 TYMNET client
# and is the default. The other two come from the 1982 pamphlet, which
# introduces them as "an acceptance message, SUCH AS a semicolon (;) or
# 'host is online'" (lines 49-53) -- explicitly examples rather than a
# closed set, with no statement of what selected between them. A third
# form attested by a real client therefore fills a gap the pamphlet
# left open rather than contradicting it.
#
# Note the pamphlet's two are not equally attested even there: "host is
# online" has a catalogue entry (line 231), the semicolon does not
# appear in the catalogue at all.
#
# VERIFY: what selected between forms on the real network is unknown.

accept call-connected


# --- host destinations -----------------------------------------------
#
#   host <number> <tcp-host> <tcp-port>
#
# A TYMNET destination host is identified by a number (1985 manual,
# p. 5-8, element 4), not by an X.121-style address -- TYMNET is a
# proprietary non-X.25 network. Each entry maps one host number to the
# TCP endpoint standing in for it. An unmapped number yields
# BAD HOST NUMBER.

host 3020 127.0.0.1 64001
host 1776 127.0.0.1 65002


# --- users -----------------------------------------------------------
#
#   user <username> <password|-> <default-host|-> [ignore-host]
#
# Supervisor-side validation is deliberately not modelled: NETVAL and
# the MUD are ISIS-network products with no counterpart here, so this
# table is the whole of the authentication surface. See include/tymsat.h.
#
#   password '-'      the No Password option (1985 manual, p. 14-6):
#                     the "password:" prompt is skipped entirely
#   default-host '-'  no home destination; the user must name one, and
#                     omitting it yields NO HOST SPECIFIED
#   ignore-host       the user may not name a destination at all; the
#                     default-host is always used (1985 manual, p. 14-6)
#
# The public Information Directory username from the 1982 pamphlet
# (line 7) is a natural no-password, fixed-destination entry.

user INFORMATION - 3020 ignore-host
user DAVID secret 3020
user GUEST - -
user LINC - 1776
